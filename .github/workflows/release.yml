# Publishes a signed release when a tag like v1.0.1 is pushed.
# Needs four repository secrets (Settings > Secrets and variables > Actions), see docs/RELEASING.md:
#   MHP_KEYSTORE_BASE64  (the .jks file, base64), MHP_KEYSTORE_PASSWORD, MHP_KEY_ALIAS, MHP_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Make gradlew executable (in case the repo was uploaded from Windows)
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MHP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the MHP_* secrets first (docs/RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MHP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          MHP_KEYSTORE_PASSWORD: ${{ secrets.MHP_KEYSTORE_PASSWORD }}
          MHP_KEY_ALIAS: ${{ secrets.MHP_KEY_ALIAS }}
          MHP_KEY_PASSWORD: ${{ secrets.MHP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease

      - name: Check the signer and package the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="MediaHomePure-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          grep -qi "SHA-256 digest: 11663fd6a8c4fc575ce3bdac382deaeaa9997a3d57b218ac4cfaea1282f66724" signer.txt \
            || { echo "::error::The APK is not signed with the Media Home Pure release key"; exit 1; }
          sha256sum "$APK" > "$APK.sha256"
          awk -v v="## $VERSION" 'index($0, v) == 1 {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "Media Home Pure ${GITHUB_REF_NAME#v}" --notes-file notes.md
